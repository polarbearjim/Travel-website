<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日月潭浪漫小旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* 日系繪本風：和紙白底、3px 墨灰粗框、大圓角、平塗配色。 */
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --ink-soft:#6A625F; --white:#FFFFFF;
  --coral:#F2A497; --yellow:#F6D27A; --blue:#A8D3E6; --green:#B9DAA5;
  --line:3px solid var(--ink);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --font:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --nav-h:56px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.7 var(--font);
  padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px));
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{scroll-margin-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 14px)}

/* top nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--paper);border-bottom:var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.nav-in{max-width:600px;margin:0 auto;height:var(--nav-h);display:flex;align-items:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;white-space:nowrap;text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.menu{margin-left:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu a{flex:none;text-decoration:none;font-size:14px;line-height:1;padding:8px 12px;border:var(--line);border-radius:999px;background:var(--white)}
.menu a:nth-child(1){background:var(--yellow)}
.menu a:nth-child(2){background:var(--coral)}
.menu a:nth-child(3){background:var(--green)}
.menu a:nth-child(4){background:var(--blue)}
@media (max-width:400px){.brand span{display:none}}

/* shared cards */
.card{background:var(--white);border:var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);padding:18px}
.h2{margin:0 0 14px;font-size:22px;line-height:1.4;font-weight:400;display:flex;align-items:center;gap:10px}
.h2 .dot{width:18px;height:18px;border:var(--line);border-radius:50%;flex:none}

/* hero */
.hero{background:var(--paper);border:var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);overflow:hidden;margin-top:18px}
.hero svg{display:block;width:100%;height:auto}
.hero-text{padding:6px 20px 22px;text-align:center}
.eyebrow{display:inline-block;margin:0 0 8px;padding:2px 14px;border:var(--line);border-radius:999px;background:var(--yellow);font-size:14px}
.title{margin:0;font-size:clamp(28px,8.5vw,38px);line-height:1.3;font-weight:400}
.route{margin:6px 0 0;color:var(--ink-soft);font-size:16px}
.count{margin-top:16px;border:var(--line);border-radius:var(--r-md);background:var(--blue);padding:14px 12px 12px}
.count .lab{margin:0 0 8px;font-size:15px}
.cd-boxes{display:flex;justify-content:center;gap:10px}
.cd-box{min-width:68px;padding:6px 8px 4px;background:var(--white);border:var(--line);border-radius:var(--r-sm)}
.cd-num{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.cd-unit{display:block;font-size:13px;color:var(--ink-soft)}
.count .big{margin:0;font-size:22px}
.datewrap{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.datewrap label{font-size:14px}
.date{min-height:44px;padding:6px 12px;background:var(--white);border:var(--line);border-radius:var(--r-sm)}
.btn{min-height:44px;padding:6px 18px;background:var(--yellow);border:var(--line);border-radius:999px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* ticket */
.ticket{position:relative;background:var(--yellow);border:var(--line);border-radius:var(--r-lg);box-shadow:0 5px 0 var(--ink);padding:0;overflow:hidden}
.ticket-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:3px dashed var(--ink)}
.ticket-top b{font-weight:400;font-size:15px}
.stamp{padding:1px 12px;border:var(--line);border-radius:999px;background:var(--white);font-size:13px}
.legs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:16px 18px 8px;text-align:center}
.legs .city{margin:0;font-size:26px;line-height:1.2}
.legs .sub{margin:0;font-size:13px;color:var(--ink);opacity:.8}
.legs svg{width:64px;height:40px}
.ticket-bot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px 18px 16px}
.ticket-bot div{background:var(--paper);border:var(--line);border-radius:var(--r-sm);padding:6px 8px;text-align:center}
.ticket-bot small{display:block;font-size:12px;color:var(--ink-soft)}
.ticket-bot span{font-size:15px}
.ticket-bot b{font-weight:400}
.ticket-link{display:block;margin:0 18px 18px;padding:10px;text-align:center;background:var(--white);border:var(--line);border-radius:999px;text-decoration:none}
.notch{position:absolute;top:50%;width:22px;height:22px;background:var(--paper);border:var(--line);border-radius:50%}

/* tabs */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tab{min-height:46px;padding:6px 18px;border:var(--line);border-radius:999px;background:var(--white);cursor:pointer;text-align:center;line-height:1.2}
.tab small{display:block;font-size:12px;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--coral);box-shadow:0 4px 0 var(--ink)}
.tab[aria-selected="true"] small{color:var(--ink)}
.day-note{margin:0 0 14px;color:var(--ink-soft);font-size:15px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:14px;top:12px;bottom:12px;border-left:3px dashed var(--ink)}
.stop{position:relative;padding-left:44px;margin-bottom:16px}
.stop:last-child{margin-bottom:0}
.pin{position:absolute;left:3px;top:14px;width:24px;height:24px;border:var(--line);border-radius:50%;background:var(--white)}
.stop.must .pin{background:var(--yellow)}
.stop-card{background:var(--paper);border:var(--line);border-radius:var(--r-md);padding:12px 14px 12px}
.stop.must .stop-card{background:var(--white);box-shadow:0 4px 0 var(--ink)}
.time{display:inline-block;margin:0 0 4px;padding:0 12px;background:var(--blue);border:var(--line);border-radius:999px;font-size:14px;font-variant-numeric:tabular-nums}
.stop h3{margin:0;font-size:18px;line-height:1.45;font-weight:400;overflow-wrap:anywhere}
.addr{margin:2px 0 0;font-size:14px;color:var(--ink-soft);overflow-wrap:anywhere}
.note{margin:2px 0 0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;padding:0 12px;border:var(--line);border-radius:999px;font-size:13px;line-height:1.7}
.tag.drive{background:var(--coral)}
.tag.walk{background:var(--green)}
.tag.bus{background:var(--blue)}
.tag.must{background:var(--yellow)}
.maplink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:40px;padding:4px 14px;border:var(--line);border-radius:999px;background:var(--white);text-decoration:none;font-size:14px}
.maplink svg{width:16px;height:16px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0;font-size:13px;color:var(--ink-soft);align-items:center}

/* todo */
.progress{height:18px;border:var(--line);border-radius:999px;background:var(--paper);overflow:hidden;margin:0 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .35s cubic-bezier(.34,1.56,.64,1)}
.progress-t{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.todo li{display:flex;align-items:center;gap:6px;border:var(--line);border-radius:var(--r-md);background:var(--paper);padding:2px 6px 2px 2px}
.todo label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px 8px;cursor:pointer;overflow-wrap:anywhere}
.todo input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:28px;height:28px;border:var(--line);border-radius:9px;background:var(--white);display:grid;place-items:center}
.box svg{width:18px;height:18px;opacity:0;stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.todo input:checked + .box{background:var(--green)}
.todo input:checked + .box svg{opacity:1}
.todo input:checked ~ .tx{text-decoration:line-through;color:var(--ink-soft)}
.todo input:focus-visible + .box{outline:3px solid var(--ink);outline-offset:3px}
.del{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:50%;cursor:pointer;font-size:22px;line-height:1}
.add{display:flex;gap:8px;margin-top:14px}
.add input{flex:1;min-width:0;min-height:46px;padding:6px 14px;border:var(--line);border-radius:999px;background:var(--white)}

/* stay */
.stay{background:var(--green)}
.stay-body{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}
.stay-body > svg{width:96px;height:auto}
.stay h3{margin:0;font-size:20px;line-height:1.4;font-weight:400}
.stay p{margin:2px 0 0;font-size:15px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:2px 14px;background:var(--white);border:var(--line);border-radius:999px;font-size:14px}
@media (max-width:380px){.stay-body{grid-template-columns:1fr}.stay-body > svg{width:80px}}

footer{text-align:center;color:var(--ink-soft);font-size:14px}
footer svg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto 6px}

/* motion */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes twinkle{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wobble{0%,100%{transform:translateX(0) translateY(0)}25%{transform:translateX(5px) translateY(-1.5px)}50%{transform:translateX(10px) translateY(0)}75%{transform:translateX(5px) translateY(-1.5px)}}
@keyframes pop{0%{transform:scale(.88) translateY(14px);opacity:.2}55%{transform:scale(1.04) translateY(-4px);opacity:1}100%{transform:scale(1) translateY(0)}}
@keyframes tabpop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.a{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 4s ease-in-out infinite}
.drift{animation:drift 9s ease-in-out infinite}
.drift2{animation:drift 12s ease-in-out infinite reverse}
.sway{animation:sway 3.6s ease-in-out infinite}
.tw1{animation:twinkle 2.4s ease-in-out infinite}
.tw2{animation:twinkle 3.1s ease-in-out .8s infinite}
.tw3{animation:twinkle 2.8s ease-in-out 1.4s infinite}
.spin{animation:spin 26s linear infinite}
.car{animation:wobble 5s ease-in-out infinite}
.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.tabpop{animation:tabpop .4s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<nav class="nav" aria-label="主選單">
  <div class="nav-in">
    <a class="brand" href="#top" aria-label="回到頂端">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/><path d="M5 21q5-5 10 0t12 0" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="11" r="3" fill="#F2A497" stroke="#3E3A39" stroke-width="2"/></svg>
      <span>日月潭小旅行</span>
    </a>
    <div class="menu">
      <a href="#top">首頁</a>
      <a href="#plan">行程</a>
      <a href="#todo">待辦</a>
      <a href="#stay">住宿</a>
    </div>
  </div>
</nav>

<main class="wrap" id="top">

  <!-- 首頁 -->
  <header class="hero">
    <svg viewBox="0 0 360 250" role="img" aria-label="日月潭插畫：湖面上的小船、山丘上的慈恩塔、夜空的煙火，和一輛開在湖邊的小車">
      <!-- sun -->
      <g class="spin" style="transform-origin:300px 52px">
        <g stroke="#3E3A39" stroke-width="3" stroke-linecap="round">
          <path d="M300 20v-8M300 92v-8M268 52h-8M340 52h-8M277 29l-6-6M329 81l-6-6M323 29l6-6M271 81l6-6"/>
        </g>
      </g>
      <circle cx="300" cy="52" r="22" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
      <!-- fireworks -->
      <g class="a tw1" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M58 58v-22M58 58v22M58 58h-22M58 58h22M58 58l-15-15M58 58l15 15M58 58l15-15M58 58l-15 15" stroke="#F2A497"/>
        <circle cx="58" cy="58" r="6" fill="#F6D27A"/>
      </g>
      <g class="a tw2" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M150 36v-14M150 36v14M150 36h-14M150 36h14M150 36l-10-10M150 36l10 10M150 36l10-10M150 36l-10 10" stroke="#F6D27A"/>
        <circle cx="150" cy="36" r="5" fill="#F2A497"/>
      </g>
      <g class="a tw3">
        <circle cx="105" cy="92" r="4" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2.5"/>
        <circle cx="205" cy="76" r="4" fill="#F2A497" stroke="#3E3A39" stroke-width="2.5"/>
      </g>
      <!-- clouds -->
      <g class="a drift">
        <path d="M200 40q-4-16 12-16q6-10 18-4q14-2 14 12q10 2 8 12h-48q-10-1-4-4z" fill="#fff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g class="a drift2">
        <path d="M14 112q-3-12 9-12q5-8 14-3q11-1 11 9q8 2 6 9h-36q-8 0-4-3z" fill="#fff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <!-- hills -->
      <path d="M0 165Q40 125 90 143T170 133Q215 121 256 108Q300 120 360 138V200H0Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <!-- 慈恩塔 -->
      <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round">
        <rect x="247" y="94" width="18" height="15" fill="#F6D27A"/>
        <path d="M242 94H270L265 87H247Z" fill="#F2A497"/>
        <rect x="249" y="79" width="14" height="8" fill="#F6D27A"/>
        <path d="M245 79H267L263 72H249Z" fill="#F2A497"/>
        <rect x="251" y="65" width="10" height="7" fill="#F6D27A"/>
        <path d="M247 65H265L261 58H251Z" fill="#F2A497"/>
        <path d="M256 58V48" stroke-linecap="round"/>
      </g>
      <circle cx="256" cy="46" r="3" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
      <!-- trees -->
      <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round">
        <circle cx="46" cy="150" r="13" fill="#B9DAA5"/><path d="M46 163v8" stroke-linecap="round"/>
        <circle cx="112" cy="150" r="10" fill="#B9DAA5"/><path d="M112 160v7" stroke-linecap="round"/>
        <circle cx="318" cy="143" r="12" fill="#B9DAA5"/><path d="M318 155v8" stroke-linecap="round"/>
      </g>
      <!-- lake -->
      <path d="M0 176Q45 164 90 176T180 176T270 176T360 176V246H0Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <g fill="none" stroke="#FFFCF6" stroke-width="3" stroke-linecap="round">
        <path d="M24 196q8-6 16 0t16 0"/><path d="M196 200q8-6 16 0t16 0"/><path d="M150 222q8-6 16 0t16 0"/><path d="M286 204q8-6 16 0t16 0"/>
      </g>
      <!-- boat -->
      <g class="sway" style="transform-origin:110px 214px">
        <path d="M110 198V166L134 198Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        <path d="M84 198H138L128 214H94Z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <!-- foreground & car -->
      <path d="M0 238Q90 228 180 236T360 233V250H0Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
      <g class="car">
        <rect x="232" y="214" width="58" height="20" rx="9" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/>
        <path d="M243 214L250 200H272L281 214Z" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
        <path d="M252 213L256 203H264V213ZM268 213V203H272L277 213Z" fill="#A8D3E6" stroke="#3E3A39" stroke-width="2"/>
        <circle cx="245" cy="235" r="6" fill="#3E3A39"/><circle cx="245" cy="235" r="2" fill="#FFFCF6"/>
        <circle cx="277" cy="235" r="6" fill="#3E3A39"/><circle cx="277" cy="235" r="2" fill="#FFFCF6"/>
      </g>
    </svg>
    <div class="hero-text">
      <p class="eyebrow">一日小旅行</p>
      <h1 class="title">日月潭浪漫之旅</h1>
      <p class="route">豐原 → 水里 → 日月潭</p>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
  </header>

  <!-- 交通 -->
  <section id="go" aria-labelledby="go-h">
    <h2 class="h2" id="go-h"><span class="dot" style="background:var(--coral)"></span>交通資訊</h2>
    <div class="ticket">
      <div class="ticket-top"><b>自駕 ＋ 接駁車</b><span class="stamp">一日券</span></div>
      <div class="legs">
        <div><p class="city">豐原</p><p class="sub">台中・08:30 出發</p></div>
        <svg viewBox="0 0 64 40" aria-hidden="true">
          <path d="M4 20H52" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
          <path d="M44 10L58 20L44 30" fill="#F2A497" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div><p class="city">日月潭</p><p class="sub">水社・約 17:00</p></div>
      </div>
      <div class="ticket-bot">
        <div><small>去程</small><span><b>自駕</b></span></div>
        <div><small>停車</small><span><b>水社周邊</b></span></div>
        <div><small>晚上</small><span><b>接駁車</b></span></div>
      </div>
      <a class="ticket-link" id="routeLink" href="#" target="_blank" rel="noopener noreferrer">在 Google 地圖看整趟路線</a>
    </div>
  </section>

  <!-- 行程 -->
  <section id="plan" aria-labelledby="plan-h">
    <h2 class="h2" id="plan-h"><span class="dot" style="background:var(--yellow)"></span>每日行程</h2>
    <div class="card">
      <div class="tabs" role="tablist" aria-label="選擇日期" id="tabs"></div>
      <p class="day-note" id="dayNote"></p>
      <div id="panel" role="tabpanel" tabindex="-1">
        <ol class="tl" id="tl"></ol>
      </div>
      <p class="legend" aria-label="標籤說明">
        <span class="tag drive">自駕</span><span class="tag walk">步行</span><span class="tag bus">接駁車</span><span class="tag must">必去</span>
      </p>
    </div>
  </section>

  <!-- 待辦 -->
  <section id="todo" aria-labelledby="todo-h">
    <h2 class="h2" id="todo-h"><span class="dot" style="background:var(--green)"></span>出發前待辦</h2>
    <div class="card">
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <p class="progress-t" id="progT"></p>
      <ul class="todo" id="todoList"></ul>
      <form class="add" id="addForm">
        <input id="addIn" type="text" maxlength="40" placeholder="新增一項待辦" aria-label="新增待辦事項" autocomplete="off">
        <button class="btn" type="submit">新增</button>
      </form>
    </div>
  </section>

  <!-- 住宿 -->
  <section id="stay" aria-labelledby="stay-h">
    <h2 class="h2" id="stay-h"><span class="dot" style="background:var(--blue)"></span>住宿資訊</h2>
    <div class="card stay">
      <div class="stay-body">
        <svg viewBox="0 0 96 90" role="img" aria-label="民宿小房子插畫">
          <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
            <rect x="12" y="38" width="72" height="44" rx="4" fill="#FFFCF6"/>
            <path d="M6 42L48 10L90 42Z" fill="#F2A497"/>
            <rect x="40" y="56" width="16" height="26" rx="3" fill="#F6D27A"/>
            <rect x="19" y="50" width="14" height="14" rx="3" fill="#A8D3E6"/>
            <rect x="63" y="50" width="14" height="14" rx="3" fill="#A8D3E6"/>
            <path d="M70 18V8h8v18" fill="#FFFCF6"/>
          </g>
          <g class="a bob"><circle cx="82" cy="12" r="4" fill="#fff" stroke="#3E3A39" stroke-width="2.5"/></g>
        </svg>
        <div>
          <h3>恩典花園咖啡民宿</h3>
          <p>南投縣水里鄉博愛路101號</p>
          <div class="chips"><span class="chip">16:00 Check-in</span><span class="chip">煙火後回來休息</span></div>
          <a class="maplink" id="stayMap" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <svg viewBox="0 0 360 70" aria-hidden="true">
      <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M0 52Q60 28 120 46T240 44T360 40V70H0Z" fill="#B9DAA5"/>
        <g class="a bob"><circle cx="70" cy="30" r="9" fill="#F2A497"/></g>
        <g class="a bob" style="animation-delay:.9s"><circle cx="290" cy="26" r="7" fill="#F6D27A"/></g>
      </g>
    </svg>
    旅途愉快，玩得開心
  </footer>
</main>

<script>
(function(){
'use strict';

/* ---------- 資料 ---------- */
var DAYS=[{
  id:'d1',label:'Day 1',sub:'豐原出發',
  note:'自駕出遊，晚上搭接駁車到向山看音樂會和煙火。',
  stops:[
    {t:'08:30',n:'豐原出發',a:'台中豐原',q:'台中市豐原區',tags:['drive']},
    {t:'10:00～11:00',n:'妮珂森咖啡 Niksen Café',a:'南投國姓鄉',q:'妮珂森咖啡 Niksen Café 國姓鄉',tags:['drive']},
    {t:'12:00～13:30',n:'阿成的家（午餐）',a:'南投縣水里鄉上安村三部路36號',q:'阿成的家 南投縣水里鄉上安村三部路36號',tags:['drive'],must:true},
    {t:'13:30～14:30',n:'上安周邊散步／拍照',a:'水里鄉上安村',q:'南投縣水里鄉上安村',tags:['walk']},
    {t:'14:30～15:30',n:'車埕老街＋貯木池',a:'水里鄉車埕',q:'車埕老街 南投縣水里鄉',tags:['drive','walk'],must:true},
    {t:'16:00',n:'恩典花園咖啡民宿 Check-in',a:'南投縣水里鄉博愛路101號',q:'恩典花園咖啡民宿 南投縣水里鄉博愛路101號',tags:['drive']},
    {t:'16:00～16:30',n:'民宿休息',a:'',q:'',tags:[],note:'小睡一下，補充體力。'},
    {t:'16:30 左右',n:'出發往日月潭',a:'',q:'',tags:['drive']},
    {t:'約 17:00',n:'抵達水社周邊停車',a:'日月潭水社',q:'日月潭水社碼頭停車場',tags:['drive','bus'],note:'停好車，再搭接駁車前往向山。'},
    {t:'晚上',n:'向山遊客中心 音樂會＋煙火',a:'日月潭向山',q:'日月潭向山遊客中心',tags:['bus'],must:true},
    {t:'煙火後',n:'返回水里民宿',a:'南投縣水里鄉博愛路101號',q:'恩典花園咖啡民宿 南投縣水里鄉博愛路101號',tags:['bus','drive']}
  ]
}];
var TAGNAME={drive:'自駕',walk:'步行',bus:'接駁車'};
var DEFAULT_TODO=[
  '確認向山遊客中心音樂會與煙火的場次、時間',
  '預約阿成的家午餐',
  '確認恩典花園咖啡民宿 16:00 Check-in',
  '確認水社周邊停車位與接駁車時間',
  '車子檢查、加滿油',
  '帶薄外套（山上晚上比較涼）',
  '手機和行動電源充飽電',
  '帶相機和記憶卡'
];

/* ---------- 小工具 ---------- */
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function mapHref(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
var pin='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.500-6-6.500-11a6.500 6.500 0 0 1 13 0c0 5-6.500 11-6.500 11z" fill="#F2A497" stroke="#3E3A39" stroke-width="2.500" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.400" fill="#fff" stroke="#3E3A39" stroke-width="2"/></svg>';
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 整趟路線 ---------- */
(function(){
  var pts=['台中市豐原區','妮珂森咖啡 Niksen Café 國姓鄉','阿成的家 南投縣水里鄉上安村三部路36號','車埕老街 南投縣水里鄉','恩典花園咖啡民宿 南投縣水里鄉博愛路101號','日月潭水社碼頭停車場'];
  var e=encodeURIComponent;
  $('routeLink').href='https://www.google.com/maps/dir/?api=1&origin='+e(pts[0])+'&destination='+e(pts[pts.length-1])+'&waypoints='+pts.slice(1,-1).map(e).join('%7C')+'&travelmode=driving';
  var s=$('stayMap');s.href=mapHref('恩典花園咖啡民宿 南投縣水里鄉博愛路101號');s.innerHTML=pin+'<span>在 Google 地圖開啟</span>';
})();

/* ---------- 出發倒數 ---------- */
var KEY_DATE='trip-date';
function parseDate(v){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?new Date(+m[1],+m[2]-1,+m[3],8,30,0):null;}
function renderCount(){
  var box=$('count');box.textContent='';
  var v=store(KEY_DATE),t=parseDate(v),ms=t?t-new Date():0;
  var lab=el('p','lab');
  if(!t){
    lab.textContent='選好出發日期，開始倒數';box.appendChild(lab);
  }else if(ms>0){
    lab.textContent='距離 '+(t.getMonth()+1)+'/'+t.getDate()+' 08:30 出發還有';box.appendChild(lab);
    var d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
    var boxes=el('div','cd-boxes');
    [[d,'天'],[h,'小時'],[m,'分鐘']].forEach(function(x){var b=el('div','cd-box');b.appendChild(el('span','cd-num',String(x[0])));b.appendChild(el('span','cd-unit',x[1]));boxes.appendChild(b);});
    box.appendChild(boxes);
  }else if(ms>-864e5){
    box.appendChild(el('p','big','今天出發，玩得開心！'));
  }else{
    box.appendChild(el('p','big','這趟旅程結束了，期待下一次出發'));
  }
  var w=el('div','datewrap');
  var lb=el('label',null,'出發日期');lb.setAttribute('for','dateIn');
  var inp=el('input','date');inp.type='date';inp.id='dateIn';if(v)inp.value=v;
  inp.addEventListener('change',function(){store(KEY_DATE,inp.value);renderCount();renderTabs(true);});
  w.appendChild(lb);w.appendChild(inp);box.appendChild(w);
}
renderCount();setInterval(function(){var a=document.activeElement;if(!a||a.id!=='dateIn')renderCount();},30000);

/* ---------- 日期切換 + 時間軸 ---------- */
var cur=0;
function dayLabel(i){
  var t=parseDate(store(KEY_DATE));if(!t)return DAYS[i].sub;
  t.setDate(t.getDate()+i);
  return (t.getMonth()+1)+'/'+t.getDate()+'（'+'日一二三四五六'.charAt(t.getDay())+'）';
}
function renderTabs(keepFocus){
  var tabs=$('tabs');tabs.textContent='';
  DAYS.forEach(function(d,i){
    var b=el('button','tab');b.type='button';b.id='tab-'+i;
    b.setAttribute('role','tab');b.setAttribute('aria-selected',i===cur?'true':'false');
    b.setAttribute('aria-controls','panel');b.tabIndex=i===cur?0:-1;
    b.appendChild(document.createTextNode(d.label));b.appendChild(el('small',null,dayLabel(i)));
    b.addEventListener('click',function(){select(i,true);});
    b.addEventListener('keydown',function(e){
      var n=null;if(e.key==='ArrowRight')n=(cur+1)%DAYS.length;if(e.key==='ArrowLeft')n=(cur+DAYS.length-1)%DAYS.length;
      if(n!==null){e.preventDefault();select(n,true);$('tab-'+n).focus();}
    });
    tabs.appendChild(b);
  });
}
function bounce(node,cls){if(reduce)return;node.classList.remove(cls);void node.offsetWidth;node.classList.add(cls);}
function select(i,animate){
  cur=i;renderTabs();renderStops();
  if(animate){bounce($('tab-'+i),'tabpop');bounce($('tl'),'pop');}
}
function renderStops(){
  var d=DAYS[cur];$('dayNote').textContent=d.note;$('panel').setAttribute('aria-labelledby','tab-'+cur);
  var ol=$('tl');ol.textContent='';
  d.stops.forEach(function(s){
    var li=el('li','stop'+(s.must?' must':''));
    li.appendChild(el('span','pin'));
    var c=el('div','stop-card');
    c.appendChild(el('span','time',s.t));
    c.appendChild(el('h3',null,s.n));
    if(s.a)c.appendChild(el('p','addr',s.a));
    if(s.note)c.appendChild(el('p','note',s.note));
    var tg=el('div','tags');
    if(s.must)tg.appendChild(el('span','tag must','★ 必去'));
    s.tags.forEach(function(k){tg.appendChild(el('span','tag '+k,TAGNAME[k]));});
    if(tg.childNodes.length)c.appendChild(tg);
    if(s.q){
      var a=el('a','maplink');a.href=mapHref(s.q);a.target='_blank';a.rel='noopener noreferrer';
      a.setAttribute('aria-label',s.n+'，在 Google 地圖開啟');a.innerHTML=pin+'<span>Google 地圖</span>';
      c.appendChild(a);
    }
    li.appendChild(c);ol.appendChild(li);
  });
}
renderTabs();renderStops();

/* ---------- 待辦清單 ---------- */
var KEY_TODO='trip-todo-v1';
var todos=(function(){
  try{var r=JSON.parse(store(KEY_TODO));if(Array.isArray(r))return r.filter(function(x){return x&&typeof x.t==='string';});}catch(e){}
  return DEFAULT_TODO.map(function(t,i){return {id:'d'+i,t:t,done:false};});
})();
function saveTodos(){store(KEY_TODO,JSON.stringify(todos));}
function renderTodos(){
  var ul=$('todoList');ul.textContent='';
  todos.forEach(function(x){
    var li=el('li');
    var lb=el('label');
    var inp=el('input');inp.type='checkbox';inp.checked=!!x.done;
    inp.addEventListener('change',function(){x.done=inp.checked;saveTodos();progress();});
    var bx=el('span','box');bx.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.500l4.500 4.500L19 7"/></svg>';
    lb.appendChild(inp);lb.appendChild(bx);lb.appendChild(el('span','tx',x.t));
    var del=el('button','del','×');del.type='button';del.setAttribute('aria-label','刪除：'+x.t);
    del.addEventListener('click',function(){todos=todos.filter(function(y){return y!==x;});saveTodos();renderTodos();});
    li.appendChild(lb);li.appendChild(del);ul.appendChild(li);
  });
  progress();
}
function progress(){
  var n=todos.length,d=todos.filter(function(x){return x.done;}).length;
  $('bar').style.width=(n?Math.round(d/n*100):0)+'%';
  $('progT').textContent=n?('已完成 '+d+' / '+n+(d===n?'，準備好出發了！':'')):'目前沒有待辦事項';
}
$('addForm').addEventListener('submit',function(e){
  e.preventDefault();var v=$('addIn').value.trim();if(!v)return;
  todos.push({id:'n'+Date.now(),t:v.slice(0,40),done:false});$('addIn').value='';saveTodos();renderTodos();
});
renderTodos();
})();
</script>
</body>
</html>
